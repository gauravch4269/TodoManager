{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {% block title %}
      
      {% endblock title %}
    </title>

    <!-- Bootstrap CSS (IMPORTANT) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'homepage' %}"><img src="{% static 'image/logo.png' %}" alt="TodoManager" width="80" height="40"></a>

        <button class="navbar-toggler" type="button" 
          data-bs-toggle="collapse" 
          data-bs-target="#navbarNavAltMarkup">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav">
            <a class="nav-link active" href="{% url 'homepage' %}">Home</a>
            <a class="nav-link" href="{% url 'todolist' %}">Todolist</a>
            <a class="nav-link" href="{% url 'contact' %}">Contact Us</a>
            <a class="nav-link" href="{% url 'about' %}">About Us</a>
            
          </div>
        </div>
      </div>
    </nav>
    <div class="container" >
        <h2>
          {% block headline %}
          
          {% endblock headline %}
        </h2>
    </div>
    {% block content %} {% endblock content %}


    <!-- Bootstrap JS (IMPORTANT for toggle) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  </body>
</html>
